name: Build Docker

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - "3.*-dev"
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Lint
        run: cd backend && uv run ruff check src
      - name: Type check
        run: cd backend && uv run mypy src
      - name: Test
        run: |
          mkdir -p backend/config
          cd backend && uv run pytest src/test -v -m "not e2e"

  webui-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: cd webui && pnpm install

      - name: Lint
        run: cd webui && pnpm lint

      - name: Unit test
        run: cd webui && pnpm test

      - name: build test
        run: |
          cd webui && pnpm test:build

  version-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 发布只由手动推送 tag 触发：
      #   - 稳定版：语义化版本号 tag（如 3.3.2），且必须打在 main 的提交上
      #   - 预发布：包含 alpha/beta 的 tag（如 3.4.0-beta.1），在 dev 分支上打
      # 合并 PR 不再触发发布（防止 PR 标题被当作版本号，见 #1065）。
      - name: Classify trigger
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/classify_release.py --output "$GITHUB_OUTPUT"
      - name: Check result
        run: |
          echo "release: ${{ steps.classify.outputs.release }}"
          echo "dev: ${{ steps.classify.outputs.dev }}"
          echo "build_test: ${{ steps.classify.outputs.build_test }}"
          echo "version: ${{ steps.classify.outputs.version }}"
    outputs:
      release: ${{ steps.classify.outputs.release }}
      dev: ${{ steps.classify.outputs.dev }}
      build_test: ${{ steps.classify.outputs.build_test }}
      version: ${{ steps.classify.outputs.version }}

  build-webui:
    runs-on: ubuntu-latest
    needs: [test, webui-test, version-info]
    if: ${{ needs.version-info.outputs.release == 1 || needs.version-info.outputs.dev == 1 || needs.version-info.outputs.build_test == 1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: cd webui && pnpm install

      - name: Build
        run: |
          cd webui && pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: webui/dist

  build-docker:
    runs-on: ubuntu-latest
    needs: [build-webui, version-info]
    if: ${{ needs.version-info.outputs.release == 1 || needs.version-info.outputs.dev == 1 || needs.version-info.outputs.build_test == 1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Version info via tag
        working-directory: ./backend/src
        run: |
          echo ${{ needs.version-info.outputs.version }}
          echo "VERSION='${{ needs.version-info.outputs.version }}'" >> module/__version__.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: backend/src/dist

      # This fork has no DockerHub credentials and doesn't publish images --
      # validate the Dockerfile still builds (both platforms) without pushing
      # anywhere, regardless of release/dev/build_test.
      - name: Build test (no push -- this fork doesn't publish Docker images)
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ needs.version-info.outputs.version }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,scope=${{ github.workflow }},ignore-error=true

  release:
    runs-on: ubuntu-latest
    needs: [build-docker, version-info]
    if: ${{ needs.version-info.outputs.release == 1 }}
    outputs:
      url: ${{ steps.release.outputs.url }}
      version: ${{ needs.version-info.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact webui
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: webui/dist

      - name: Zip webui
        run: |
          cd webui && ls -al && tree && zip -r dist.zip dist

      - name: Download artifact app
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: backend/src/dist

      - name: Create Version info via tag
        working-directory: ./backend/src
        run: |
          echo ${{ needs.version-info.outputs.version }}
          echo "VERSION='${{ needs.version-info.outputs.version }}'" >> module/__version__.py

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Generate requirements.txt for non-uv consumers (#994)
        run: |
          cd backend && uv export --format requirements-txt --no-hashes --no-dev -o requirements.txt

      - name: Zip app
        run: |
          cd backend && zip -r app-v${{ needs.version-info.outputs.version }}.zip \
            src pyproject.toml uv.lock requirements.txt

      # This fork doesn't have an UPDATE_SIGNING_KEY (upstream's own key for
      # their online auto-update feature) -- skip building/signing the bundle
      # entirely rather than hard-failing the release job. The Dockerfile's
      # boot_overlay only applies a bundle if one is present, so omitting it
      # just means this fork's installs update the normal way (new image/zip).

      - name: Generate Release info
        id: release-info
        run: |
          if ${{ needs.version-info.outputs.dev == 1 }}; then
            echo "version=🌙${{ needs.version-info.outputs.version }}" >> $GITHUB_OUTPUT
            echo "pre_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=🌟${{ needs.version-info.outputs.version }}" >> $GITHUB_OUTPUT
            echo "pre_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Read changelog
        id: changelog
        run: |
          # Derive the changelog file from the release version's major.minor (e.g. 3.3.0-beta.1 -> 3.3.md)
          CHANGELOG_VERSION=$(echo "${{ needs.version-info.outputs.version }}" | grep -oE '^[0-9]+\.[0-9]+')
          CHANGELOG_FILE="docs/changelog/${CHANGELOG_VERSION}.md"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            cat "$CHANGELOG_FILE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version-info.outputs.version }}
          name: ${{ steps.release-info.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ steps.release-info.outputs.pre_release == 'true' }}
          files: |
            webui/dist.zip
            backend/app-v${{ needs.version-info.outputs.version }}.zip
        env:
          # The repo-scoped token GitHub provides automatically -- no secret
          # to configure. Needs Settings > Actions > General > Workflow
          # permissions > "Read and write permissions" for release creation.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Disabled: this fork has no TELEGRAM_TO/TELEGRAM_TOKEN configured. Re-enable
  # if you set up a bot for release notifications.
  # telegram:
  #   runs-on: ubuntu-latest
  #   needs: [release]
  #   steps:
  #     - name: send telegram message on push
  #       uses: appleboy/telegram-action@master
  #       with:
  #         to: ${{ secrets.TELEGRAM_TO }}
  #         token: ${{ secrets.TELEGRAM_TOKEN }}
  #         message: |
  #           New release: ${{ needs.release.outputs.version }}
  #           Link: ${{ needs.release.outputs.url }}
